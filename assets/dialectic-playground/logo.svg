<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="dp-title">
  <title id="dp-title">Dialectic Playground — Dialectic Playground logo</title>
  <!-- Scaffolded by tools/scaffold-assets.sh from assets/templates/logo.svg.tmpl. Safe to hand-tune.
       Transparent background; wordmark adapts to light/dark via prefers-color-scheme.
       tools/generate-assets.sh replaces the theme-override marker below to render the dark variant. -->
  <style>
    .dp-ink { fill: #0F172A; }
    .dp-muted { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .dp-ink { fill: #F1F5F9; }
      .dp-muted { fill: #94A3B8; }
    }
    /*@theme-override*/
  </style>
  <g transform="translate(-18.8 -43.6) scale(0.6)">
<!-- dp-mark: the shared "core" mark. 512×512 design space, centered on (256,256).
     thesis (sky ring) × antithesis (rose ring) → synthesis (accent lens) + per-repo glyph. -->
<g class="dp-mark">
  <defs>
    <clipPath id="dp-thesis"><circle cx="200" cy="256" r="140"/></clipPath>
    <clipPath id="dp-lower-crossing"><rect x="200" y="256" width="112" height="200"/></clipPath>
  </defs>
  <circle cx="200" cy="256" r="140" fill="#38BDF8" fill-opacity="0.16"/>
  <circle cx="312" cy="256" r="140" fill="#FB7185" fill-opacity="0.16"/>
  <circle cx="312" cy="256" r="140" fill="#A78BFA" clip-path="url(#dp-thesis)"/>
  <circle cx="200" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="24"/>
  <circle cx="312" cy="256" r="140" fill="none" stroke="#FB7185" stroke-width="24"/>
  <!-- re-draw the thesis ring over the lower crossing so the rings interlock -->
  <circle cx="200" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="24" clip-path="url(#dp-lower-crossing)"/>
  <g class="dp-glyph" transform="translate(256 256) scale(1.1)">
    <!-- spark: four-point star — the moment of synthesis (organization glyph) -->
    <path d="M0,-50 C5,-14 14,-5 50,0 C14,5 5,14 0,50 C-5,14 -14,5 -50,0 C-14,-5 -5,-14 0,-50 Z" fill="#FFFFFF"/>
  </g>
</g>
  </g>
  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif" font-size="76">
    <text class="dp-ink" x="290" y="100" font-weight="700">dialectic</text>
    <text class="dp-muted" x="290" y="178" font-weight="400">playground</text>
  </g>
</svg>
