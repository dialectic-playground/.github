<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="dp-title">
  <title id="dp-title">Dialectic Playground — .github social preview</title>
  <!-- Scaffolded by tools/scaffold-assets.sh from assets/templates/social-preview.svg.tmpl. Safe to hand-tune.
       1280×640 per GitHub's social preview recommendation. -->
  <defs>
    <linearGradient id="dp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="dp-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <pattern id="dp-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#E2E8F0"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#dp-bg)"/>
  <rect width="1280" height="640" fill="url(#dp-dots)" opacity="0.07"/>
  <g transform="translate(96.8 76.8) scale(0.95)">
<!-- dp-mark: the shared "core" mark. 512×512 design space, centered on (256,256).
     thesis (sky ring) × antithesis (rose ring) → synthesis (accent lens) + per-repo glyph. -->
<g class="dp-mark">
  <defs>
    <clipPath id="dp-thesis"><circle cx="200" cy="256" r="140"/></clipPath>
    <clipPath id="dp-lower-crossing"><rect x="200" y="256" width="112" height="200"/></clipPath>
  </defs>
  <circle cx="200" cy="256" r="140" fill="#38BDF8" fill-opacity="0.16"/>
  <circle cx="312" cy="256" r="140" fill="#FB7185" fill-opacity="0.16"/>
  <circle cx="312" cy="256" r="140" fill="#4ADE80" clip-path="url(#dp-thesis)"/>
  <circle cx="200" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="24"/>
  <circle cx="312" cy="256" r="140" fill="none" stroke="#FB7185" stroke-width="24"/>
  <!-- re-draw the thesis ring over the lower crossing so the rings interlock -->
  <circle cx="200" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="24" clip-path="url(#dp-lower-crossing)"/>
  <g class="dp-glyph" transform="translate(256 256) scale(1.1)">
    <text x="0" y="16" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="700" font-size="55" fill="#052E16">.gh</text>
  </g>
</g>
  </g>
  <text x="600" y="210" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="32" fill="#94A3B8">dialectic-playground /</text>
  <text x="594" y="330" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="700" font-size="120" fill="#F8FAFC">.github</text>
  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#CBD5E1">
    <text x="600" y="420">Organization profile, community health</text>
    <text x="600" y="462">files, templates &amp; shared assets.</text>
  </g>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="24">
    <circle cx="608" cy="560" r="7" fill="#38BDF8"/><text x="624" y="568" fill="#94A3B8">thesis</text>
    <circle cx="738" cy="560" r="7" fill="#FB7185"/><text x="754" y="568" fill="#94A3B8">antithesis</text>
    <circle cx="926" cy="560" r="7" fill="#4ADE80"/><text x="942" y="568" fill="#94A3B8">synthesis</text>
  </g>
  <rect y="628" width="1280" height="12" fill="url(#dp-bar)"/>
</svg>
