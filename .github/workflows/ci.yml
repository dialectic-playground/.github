# CI for the organization's .github repository (profile, brand assets, asset tooling).
#
# Container-first: every check is a make target (see Makefile), run two ways:
# - Container (podman): the same toolchain image developers use; also proves that the
#   committed brand assets are exactly reproducible (make verify-assets).
# - Native (ubuntu-latest): the same targets with DP_RUNTIME=local.
# - DCO: Signed-off-by on every pull-request commit.
# - "CI result" is the single check required by the branch ruleset (same name in every repo).
#
# Actions are pinned to full commit SHAs (organization policy); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run catches toolchain and runner drift even when nothing changes here.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  container:
    name: Container (podman)
    runs-on: ubuntu-latest
    env:
      DP_RUNTIME: podman
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain environment
        run: make dp-info

      - name: make check verify-assets
        run: make check verify-assets

  native:
    name: Native (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      DP_RUNTIME: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native tools
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libxml2-utils gettext-base

      - name: make check
        run: make check

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # no-commit-to-branch guards local commits to main; CI legitimately runs on main.
      - name: Run every hook on all files
        env:
          SKIP: no-commit-to-branch
        run: |
          python -m pip install --disable-pip-version-check pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure --color always

  ci-result:
    name: CI result
    if: always()
    needs: [container, native, dco, pre-commit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      # Matrix jobs report one combined result to `needs`, which can hide a cancelled leg
      # (for example a runner that never started). Check every job of this run attempt.
      - name: Require every job in this run to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          IGNORED_JOBS: "CI result"
        run: |
          jobs=$(gh api "$JOBS_URL" --paginate --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
          printf '%s\n' "$jobs"
          bad=$(printf '%s\n' "$jobs" | awk -F '\t' -v ignored="$IGNORED_JOBS" '
            BEGIN { n = split(ignored, list, "|"); for (i = 1; i <= n; i++) skip[list[i]] = 1 }
            $1 in skip { next }
            $1 == "DCO" && $2 == "skipped" { next }
            $2 != "success" { print }')
          if [ -n "$bad" ]; then
            echo "::error::Not every job succeeded:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs in this run succeeded."
