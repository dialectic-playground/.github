# Publishes the asset-tools toolchain image (./Containerfile) to
# ghcr.io/dialectic-playground/asset-tools whenever it changes on main.
# Developers and CI build the same Containerfile locally; the published image is a
# ready-made copy (for example DP_IMAGE=ghcr.io/dialectic-playground/asset-tools:latest).
name: Image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish asset-tools image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # build provenance attestation
      attestations: write
      security-events: write # vulnerability scan results
    env:
      IMAGE: ghcr.io/dialectic-playground/asset-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: podman build --platform linux/amd64 --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" --file Containerfile .

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        run: |
          podman push --digestfile digest.txt "$IMAGE:$GITHUB_SHA"
          podman push "$IMAGE:latest"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      # A signed SLSA provenance statement for the pushed digest, stored by GitHub; verify with
      # gh attestation verify oci://ghcr.io/dialectic-playground/asset-tools:latest --owner dialectic-playground
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      # Reports known vulnerabilities to code scanning; it does not block publishing, because
      # the Debian packages always include some CVEs that have no fix yet.
      - name: Scan the published image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload vulnerability scan results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: asset-tools-image
